# Publish on a version tag, using npm trusted publishing (OIDC).
#
# No token is stored anywhere: the runner exchanges a short-lived GitHub OIDC
# token for the right to publish this one package, which also earns the package a
# provenance attestation. That is why this workflow exists instead of a local
# `npm publish` — a 2FA-enabled account cannot be published for by a machine, and
# handing a machine the second factor is worse than automating the release.
#
# One-time setup on npmjs.com (package → Settings → Trusted Publisher → GitHub):
#   repository: xmwengxing/dsh-client-ui-sidebar-perfmon
#   workflow:   publish.yml
#   environment: (leave blank)
name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack, but do not publish'
        type: boolean
        default: true

permissions:
  contents: write # create the GitHub Release that carries the tarball
  id-token: write # mint the OIDC token npm trusted publishing exchanges

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 24 ships a suitable 11.x, and
      # this keeps a runner image pinned to an older one from failing the release.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci

      # The contract specs read the installed dsh packages to check every
      # string-keyed extension point this plugin relies on, so they need a dsh
      # on PATH (the specs take the `dsh` executable as the authority). Pin the
      # version the plugin targets; bump it deliberately when chasing a release.
      - name: Install the dsh CLI the contract specs check against
        run: npm install -g @deepseek-ai/dsh@0.2.0-rc.2

      # Builds both halves and runs every spec, including the live Linux one.
      - run: npm test

      - name: Check the tag against the manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # A manual publish can beat this workflow (a 2FA account publishes from a
      # terminal); a version that is already on npm must not fail the run.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "$(node -p "require('./package.json').name")@$version" version > /dev/null 2>&1; then
            echo "$version is already on npm; skipping the publish step"
          else
            npm publish --provenance --access public
          fi

      # The plugin list points at a version-free asset name under
      # releases/latest/download/, so the tarball is renamed before it is attached:
      # a versioned filename would 404 the moment the next release landed.
      - name: Pack the list's tarball
        run: |
          npm pack --pack-destination dist
          mv dist/*.tgz dist/dsh-client-ui-sidebar-perfmon.tgz
          ls -l dist

      - name: Extract this version's changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " ver "([^0-9.]|$)" { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "See CHANGELOG.md for what changed in ${GITHUB_REF_NAME}." > dist/notes.md
          fi
          head -n 5 dist/notes.md

      - name: Attach the tarball to a Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release may already exist when a manual publish beat the workflow.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber dist/dsh-client-ui-sidebar-perfmon.tgz
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "perfmon ${GITHUB_REF_NAME#v}" \
              --notes-file dist/notes.md \
              dist/dsh-client-ui-sidebar-perfmon.tgz
          fi
